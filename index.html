
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">

        <section class="bmi-card">

            <div class="header">
                <p class="tagline">HEALTH & FITNESS</p>
                <h1>BMI Calculator</h1>
                <p class="subtitle">
                    Calculate your Body Mass Index
                </p>
            </div>

            <form id="bmi-form">
                
                
                <div class="input-group">
                    <label for="height">Height (cm)</label>
                    <input
                        type="number"
                        id="height"
                        placeholder="e.g. 170"                       
                        step="any"   
                    >
                </div>

                <div class="input-group">
                    <label for="weight">Weight (kg)</label>
                    <input
                        type="number"
                        id="weight"
                        placeholder="e.g. 65"
                        step="any"   
                    >
                </div>

                <button type="submit" id="calculate-btn">
                    Calculate BMI
                </button>

            </form>

            <div id="result" class="result" aria-live="polite">
                <p class="result-label">Your BMI Result</p>
                <h2 id="bmi-value">--</h2>
                <p id="bmi-category">
                    Enter your details to begin
                </p>
                <p id="error-message" class="error-message"></p>
            </div>

            <div class="bmi-guide">
                <h3>BMI Reference Guide</h3>

                <div class="guide-row">
                    <span>Underweight</span>
                    <span>Below 18.5</span>
                </div>

                <div class="guide-row">
                    <span>Healthy weight</span>
                    <span>18.5 – 24.9</span>
                </div>

                <div class="guide-row">
                    <span>Overweight</span>
                    <span>25 – 29.9</span>
                </div>

                <div class="guide-row">
                    <span>Obesity</span>
                    <span>30 and above</span>
                </div>
            </div>

            <p class="disclaimer">
                BMI is a screening tool, not a medical diagnosis.
            </p>

        </section>

    </main>

</body>
</html>
